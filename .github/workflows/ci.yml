name: CI

# ---------------------------------------------------------------------------
# Ebb's gate is missionary's own test suite running on jolt. There is nothing
# to build: a jolt project has no compile step, so the whole job is "install
# jolt, run the tests".
#
# jolt tracks the nightly build (release tag vnightly, the rolling build of
# jolt's main), so a jolt change that breaks ebb shows up the day it lands.
# The 0.8.2 pin this replaced missed jolt 0.8.21 moving the runtime's timer
# onto the monotonic clock, which left every ebb sleep and timeout armed for
# decades until v0.1.4 fixed it. The cost is that an overnight jolt commit
# can turn CI red on a tree nobody touched; that red is the point.
# `workflow_dispatch`'s `jolt-version` input still overrides it for a single
# run, which is what lets https://github.com/jlt-commons/ci-builds fan this
# out across the org against a candidate release.
# ---------------------------------------------------------------------------

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = nightly)"
        required: false
        default: ""

env:
  JOLT_VERSION: ${{ inputs.jolt-version || 'nightly' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A clean suite finishes in well under a minute. A low ceiling turns a hang
    # into a fast failure rather than a job sitting on a runner until GitHub's
    # 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The prebuilt jolt binary is self-contained -- runtime, compiler and
      # stdlib in one executable -- so there is no Chez, JVM or C toolchain to
      # install. It lands in ~/.local/bin, which is not on PATH by default.
      #
      # Passed through env rather than interpolated into the script body, so
      # the input can't be used for shell injection.
      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sL \
            https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Version
        run: jolt --version

      - name: Tests
        run: bin/test
